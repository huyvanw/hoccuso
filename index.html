<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Học Cụ Số - Toán Tiểu Học AI</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #b45309; font-size: 28px; margin-bottom: 5px; }
        p { color: #475569; font-weight: bold; }
        
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 800px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            border: 3px solid #fde68a;
            text-align: center;
        }
        .card h3 { color: #d97706; margin-bottom: 10px; }
        .card p { font-size: 13px; color: #64748b; margin-bottom: 15px; }
        .btn-play {
            background: #10b981; color: white; text-decoration: none;
            padding: 10px 20px; border-radius: 12px; font-weight: bold; display: inline-block;
        }
        .student-tracker {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08); border: 3px solid #6ee7b7;
        }
        .student-tracker h3 { color: #059669; margin-bottom: 10px; text-align: center; }
        .student-list {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
            min-height: 40px; align-items: center; padding: 10px;
            background: #f0fdf4; border-radius: 12px; border: 2px dashed #34d399;
        }
        .student-badge {
            background: #10b981; color: white; padding: 6px 14px;
            border-radius: 20px; font-size: 14px; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .empty-text { color: #94a3b8; font-size: 13px; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <h1>🎒 Kho Học Cụ Số Trực Quan</h1>
        <p>Hệ thống tự động đồng bộ danh sách học sinh tham gia</p>
    </header>

    <div class="main-container">
        <div class="grid-container">
            <div class="card">
                <h3>⚖️ Cân Thăng Bằng (12kg)</h3>
                <p>Khám phá cấu tạo số và quan hệ trọng lượng.</p>
                <a href="can_thang_bang.html" class="btn-play">Trải Nghiệm Ngay 🚀</a>
            </div>
        </div>

        <div class="student-tracker">
            <h3>🌟 Bảng Vàng Đồng Bộ Từ Mọi Thiết Bị</h3>
            <div id="studentContainer" class="student-list">
                <span class="empty-text">Đang tải danh sách học sinh từ hệ thống...</span>
            </div>
        </div>
    </div>

    <script>
        // DÁN URL WEB APP CỦA BẠN VÀO DƯỚI ĐÂY
        const WEB_APP_URL = "DÁN_URL_WEB_APP_CỦA_BẠN_VÀO_ĐÂY";

        async function loadStudentsFromSheet() {
            const container = document.getElementById('studentContainer');
            try {
                const response = await fetch(WEB_APP_URL);
                const students = await response.json();

                if (!students || students.length === 0) {
                    container.innerHTML = '<span class="empty-text">Chưa có học sinh nào ghi nhận tham gia...</span>';
                    return;
                }

                container.innerHTML = '';
                students.forEach(name => {
                    const badge = document.createElement('div');
                    badge.className = 'student-badge';
                    badge.innerText = `👦👧 ${name}`;
                    container.appendChild(badge);
                });
            } catch (error) {
                container.innerHTML = '<span class="empty-text" style="color: red;">Không thể tải dữ liệu trực tuyến.</span>';
                console.error("Lỗi tải danh sách:", error);
            }
        }

        // Tự động tải danh sách khi mở trang
        loadStudentsFromSheet();
    </script>
</body>
</html>
